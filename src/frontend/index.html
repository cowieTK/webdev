<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>APP</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>

<body>

  <div class="container">
    <div class="logo">
      <img src="../content/logo_gif.gif" alt="logo of violence">
    </div>
  </div>

  <div class="two_pokemon">
    <div class="container">
      <div class="input-group">
        <input type="text" id="userInput" placeholder="choose your pokemon">
        <button id="sendBtn">Send</button>
      </div>
      <p><span id="pokemonchosen"></span></p>
      <p><span id="pokehp"></span></p>
      <p><span id="pokeattack"></span></p>
      <p><span id="pokedefence"></span></p>
      <p><span id="pokespecialattack"></span></p>
      <p><span id="pokespecialdefence"></span></p>
      <p><span id="pokespeed"></span></p>
      <div class="pokemonimg">
        <img id="pokeimage" src="" alt="chosen pokemon">
      </div>
    </div>

    <div class="container">
      <p><span id="bonkchosen"></span></p>
      <p><span id="bonkhp"></span></p>
      <p><span id="bonkattack"></span></p>
      <p><span id="bonkdefence"></span></p>
      <p><span id="bonkspecialattack"></span></p>
      <p><span id="bonkspecialdefence"></span></p>
      <p><span id="bonkspeed"></span></p>
        <div class="bonkimg">
        <img id="bonkimage" src="" alt="chosen bonk">
      </div>
    </div>
  </div>

</body>

</html>
